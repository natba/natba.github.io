<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Works</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f4f7f6;
            color: #333;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            border-bottom: 2px solid #2c3e50;
            padding-bottom: 10px;
        }
        .controls {
            text-align: center;
            margin-bottom: 20px;
        }
        button {
            padding: 10px 20px;
            margin: 0 5px;
            cursor: pointer;
            background-color: #2980b9;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #1c5980;
        }
        section {
            background: white;
            margin-bottom: 20px;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        h2 {
	    text-align: center;
            color: #2c3e50;
            margin-top: 0;
        }
        details {
            margin-bottom: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 10px;
        }
        summary {
            font-weight: bold;
            cursor: pointer;
            outline: none;
        }
        summary:hover {
            color: #2980b9;
        }
        ul {
            list-style-type: none;
            padding-left: 20px;
        }
        li {
            margin: 5px 0;
        }
        a {
            text-decoration: none;
            color: #34495e;
        }
        a:hover {
            text-decoration: underline;
            color: #e67e22;
        }
    </style>
</head>
<body>

    <h1>Web Works</h1>
    <div class="controls">
        <button onclick="toggleAll(true)">Expand All</button>
        <button onclick="toggleAll(false)">Collapse All</button>
    </div>

    <!-- Interests/Projects -->
    <section id="projects">
        <h2>🎨 Projects</h2>
        <details>
            <summary>Robotics</summary>
            <ul>
                <li><a href="media/Barney_Tour1.mov" target="_blank">Barney</a></li>
            </ul>
        </details>
        <details>
            <summary>Games</summary>
            <ul>
                <li><a href="other/pente.html" target="_blank">Pente</a></li>
            </ul>
        </details>
    </section>

    <script>
        // Function to expand or collapse all <details> elements
        function toggleAll(isOpen) {
            const allDetails = document.querySelectorAll('details');
            allDetails.forEach(detail => {
                detail.open = isOpen;
            });
        }
    </script>
</body>
</html>
